<script>
    /* ==========================
       MOSTRAR FORMA DE PAGAMENTO
    ========================== */
    document.getElementById("pagamento")
        .addEventListener("change", function () {

            ["cartao", "dinheiro"].forEach(id => {
                document.getElementById(`pagamento-${id}`)
                    .style.display = "none";
            });

            if (this.value) {
                const secao = document.getElementById(
                    `pagamento-${this.value}`
                );

                if (secao) {
                    secao.style.display = "block";
                }
            }
        });


    /* ==========================
       ENVIAR PEDIDO WHATSAPP
    ========================== */
    document.getElementById("contato-form")
        .addEventListener("submit", function (e) {

            e.preventDefault();

            const btn = document.getElementById("btn-enviar");
            const msg = document.getElementById("mensagem-confirmacao");

            btn.innerText = "Enviando...";
            btn.disabled = true;

            // Dados do formulário
            const nome =
                document.getElementById("nome").value;

            const telefone =
                document.getElementById("telefone").value;

            const endereco =
                document.getElementById("endereco").value;

            const pagamento =
                document.getElementById("pagamento").value;

            const total =
                document.getElementById("cart-total").innerText;

            // Produtos do carrinho
            const itens =
                document.querySelectorAll("#cart-items .cart-item");

            let listaProdutos = "";

            itens.forEach(item => {
                listaProdutos += `• ${item.innerText}\n`;
            });

            // Informação extra do pagamento
            let detalhePagamento = "";

            if (pagamento === "cartao") {
                const tipodepagamento =
                    document.querySelector(
                        'select[name="tipo_cartao"]'
                    ).value;

                detalhePagamento =
                    `Tipo: ${tipodepagamento}`;
            }

            if (pagamento === "dinheiro") {
                const troco =
                    document.querySelector(
                        'input[name="troco"]'
                    ).value;

                detalhePagamento =
                    `Troco para: ${troco}`;
            }

            // Mensagem WhatsApp
            const mensagem =
`🛒 *NOVO PEDIDO*

👤 *Cliente:* ${nome}
📞 *Telefone:* ${telefone}
📍 *Endereço:* ${endereco}
📍 *Cor:* ${cor}

📦 *Produtos:*
${listaProdutos}

💰 *Total:* R$ ${total}

💳 *Pagamento:* ${pagamento}
${detalhePagamento}`;

            const numero = "5584994029361";

            // Link WhatsApp
            const url =
                `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

            // Abrir WhatsApp
            window.open(url, "_blank");

            // Mensagem de sucesso
            msg.style.display = "block";
            msg.innerText =
                "Pedido enviado para o WhatsApp!";

            // Limpa carrinho
            localStorage.removeItem("cart");

            document.getElementById("cart-items")
                .innerHTML = "";

            document.getElementById("total-itens")
                .innerText = "0";

            document.getElementById("cart-total")
                .innerText = "0.00";

            // Limpa formulário
            this.reset();

            btn.innerText = "Enviar pedido";
            btn.disabled = false;
        });
